jwt:
  secret: kargo-jwt-secret-key-deve-ser-alterado-em-producao-minimo-32-chars
  expiration-ms: 86400000

spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kargo}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  sql:
    init:
      # Em produção, desabilitar inicialização automática
      # Use ferramentas como Flyway ou Liquibase para migrations gerenciadas
      mode: never

