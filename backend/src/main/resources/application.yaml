jwt:
  secret: kargo-jwt-secret-key-deve-ser-alterado-em-producao-minimo-32-chars
  expiration-ms: 86400000

spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:kargo;DB_CLOSE_DELAY=-1}
    username: ${POSTGRES_USERNAME:sa}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
