jwt:
  secret: kargo-jwt-secret-key-deve-ser-alterado-em-producao-minimo-32-chars
  expiration-ms: 86400000

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/kargo
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
