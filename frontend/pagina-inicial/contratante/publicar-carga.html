<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KarGO - Publicar Carga.">
    <title>KarGO - Publicar Carga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/contratante.css">
</head>
<body>
<div class="layout-container">
    <aside class="ct-sidebar">
        <div class="ct-sidebar-logo">
            <a href="../index.html"><img src="../assets/images/LOGO.png" alt="KarGO" class="logo-img"></a>
        </div>
        <nav class="ct-sidebar-menu">
            <div class="ct-sidebar-links">
                <a href="dashboard.html" class="ct-menu-item">Dashboard</a>
                <a href="publicar-carga.html" class="ct-menu-item active">Publicar Carga</a>
                <a href="minhas-cargas.html" class="ct-menu-item">Acompanhar Cargas</a>
                <a href="pagamentos.html" class="ct-menu-item">Pagamentos</a>
                <a href="chat.html" class="ct-menu-item">Chat</a>
                <a href="ocorrencias.html" class="ct-menu-item">Ocorrencias</a>
                <div class="ct-sidebar-divider"></div>
                <a href="perfil.html" class="ct-menu-item">Meu Perfil</a>
            </div>
            <div class="ct-sidebar-bottom">
                <a href="configuracoes.html" class="ct-menu-item">Configuracoes</a>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <div class="ct-content-area">
            <header class="ct-topbar">
                <div class="ct-topbar-mobile-logo">
                    <a href="../index.html"><img src="../assets/images/LOGO.png" alt="KarGO" class="logo-img-mobile"></a>
                </div>
                <div class="ct-topbar-actions">
                    <div class="ct-user-profile">
                        <img src="../assets/images/embarcador.png" alt="Usuario" class="ct-user-avatar">
                        <div class="ct-user-info">
                            <span class="ct-user-name" id="ct-user-name">Embarcador</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="ct-page-title ct-reveal" style="margin-bottom:24px;">
                <h1>Publicar Nova Carga</h1>
                <p>Preencha os dados abaixo para salvar no banco de dados.</p>
            </div>

            <section class="ct-section-card ct-reveal" style="max-width:860px; margin:0 auto; padding:28px;">
                <div class="ct-grid-2col-responsive" style="gap:16px !important;">
                    <div style="grid-column: span 2;">
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Descricao da Carga</label>
                        <textarea id="pc-descricao" placeholder="Ex: Carga de alimentos paletizada" style="width:100%; height:100px; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm); resize:none;"></textarea>
                    </div>

                    <div>
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Peso</label>
                        <input id="pc-peso" type="text" placeholder="Ex: 8500 ou 8,5" style="width:100%; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm);">
                    </div>

                    <div>
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Valor Sugerido (R$)</label>
                        <input id="pc-valor" type="text" placeholder="Ex: 2.800,00" style="width:100%; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm);">
                    </div>

                    <div>
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">CEP de Origem</label>
                        <input id="pc-cep-origem" type="text" placeholder="Ex: 50000-000" style="width:100%; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm);">
                    </div>

                    <div>
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">CEP de Destino</label>
                        <input id="pc-cep-destino" type="text" placeholder="Ex: 59000-000" style="width:100%; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm);">
                    </div>

                    <div>
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Origem</label>
                        <input id="pc-origem" type="text" placeholder="Ex: Recife/PE" style="width:100%; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm);">
                    </div>

                    <div>
                        <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px;">Destino</label>
                        <input id="pc-destino" type="text" placeholder="Ex: Natal/RN" style="width:100%; padding:12px; border:1px solid var(--border-light); border-radius:var(--radius-sm);">
                    </div>

                    <div style="grid-column: span 2; padding:12px; border:1px dashed var(--border-light); border-radius:var(--radius-sm); color:var(--text-muted);">
                        Faixa sugerida para este perfil: <strong id="pc-suggest-min">R$ 2.500</strong> a <strong id="pc-suggest-max">R$ 2.900</strong>
                    </div>
                </div>

                <div style="display:flex; justify-content:flex-end; margin-top:22px;">
                    <button class="ct-btn ct-btn-success" id="pc-publish-btn" type="button">Publicar Anuncio de Carga</button>
                </div>
            </section>
        </div>
    </main>
</div>

<script src="../js/api-client.js"></script>
<script src="js/contratante.js"></script>
</body>
</html>
